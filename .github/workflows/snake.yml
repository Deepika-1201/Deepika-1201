name: Generate Contribution Snake

"on":
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Deepika-1201/Deepika-1201'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark SVGs (snk v3.5.0)
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%231BADF8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%231BADF8

      - name: Publish SVGs to the output branch (github-pages v4)
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: Update contribution snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}